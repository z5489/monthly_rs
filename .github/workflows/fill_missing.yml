name: Fill Missing Tickers

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date to fill missing tickers for (format: YYYY-MM-DD, e.g. 2026-05-29). If left empty, defaults to the latest date.'
        required: false
        default: ''

jobs:
  fill-missing-tickers:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fill missing script
        run: python scripts/fill_missing.py --date "${{ github.event.inputs.date }}"

      - name: Commit and push updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json data/*.csv docs/*.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Fill missing tickers for date: ${{ github.event.inputs.date || 'latest' }} [skip ci]" && git pull --rebase origin main && git push)
