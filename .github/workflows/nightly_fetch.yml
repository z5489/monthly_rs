name: Nightly RS Data Fetcher

on:
  schedule:
    # 4:00 AM UTC (12:00 AM / Midnight ET), Tuesday-Saturday (which covers Monday-Friday US trading days)
    - cron: '0 4 * * 2-6'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push the updated data file

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Run data pipeline
        run: python scripts/fetch.py

      - name: Commit and push updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update relative strength rankings [skip ci]" && git push)
